name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run app tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw -B test

  infra-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run infrastructure tests
        working-directory: infra
        run: mvn -B test

  build:
    needs: [ test, infra-test ]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ap-southeast-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/tradedesk:${{ steps.tag.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name tradedesk --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already exists; skipping build."
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g aws-cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Deploy
        working-directory: infra
        run: cdk deploy TradedeskApp --exclusively --require-approval never -c imageTag=${{ needs.build.outputs.tag }}