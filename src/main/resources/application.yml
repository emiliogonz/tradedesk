spring:
  application:
    name: tradedesk

  datasource:
    url: jdbc:postgresql://localhost:5432/tradedesk
    username: tradedesk
    password: tradedesk_dev_only
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate should only validate it matches,
      # never auto-generate or alter it. This is the "good database design"
      # signal from the JD: schema changes are explicit, versioned, reviewable.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:D4KtKA+vEF+wHg4fanDXc9VttxrZR1UBwNgOMDU/qOE=}
  expiration-ms: 900000