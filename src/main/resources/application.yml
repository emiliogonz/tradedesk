spring:
  application:
    name: tradedesk

  datasource:
    url: jdbc:postgresql://localhost:5432/tradedesk
    username: tradedesk
    password: tradedesk_dev_only
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema — Hibernate should only validate it matches,
      # never auto-generate or alter it. This is the "good database design"
      # signal from the JD: schema changes are explicit, versioned, reviewable.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000

tradedesk:
  snapshot:
    cron: "0 0 17 * * MON-FRI"
    zone: America/New_York

management:
  endpoints:
    web:
      exposure:
        include: health