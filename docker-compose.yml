services:
  postgres:
    image: postgres:16-alpine
    container_name: tradedesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradedesk
      POSTGRES_USER: tradedesk
      POSTGRES_PASSWORD: tradedesk_dev_only
    ports:
      - "5432:5432"
    volumes:
      - tradedesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradedesk"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: tradedesk-app
    profiles: [ "app" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradedesk
      SPRING_DATASOURCE_USERNAME: tradedesk
      SPRING_DATASOURCE_PASSWORD: tradedesk_dev_only
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  tradedesk_pgdata:
